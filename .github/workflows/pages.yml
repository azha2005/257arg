# Publica los atlas en GitHub Pages: sitio/index.html, sus miniaturas y los HTML de catalogo.py (2-nov-2026).
name: Atlas en GitHub Pages
on:
  push:
    branches: [master]
    paths: ["mapas/**/*.html", "sitio/**", "analisis/escenarios2003/simulador_2003.html", "transferencias/**/sankey_*.html", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            sitio
            mapas
            /analisis/escenarios2003/simulador_2003.html
            /transferencias/1999pe_2003pe/sankey_1999pe_2003pe.html
            /transferencias/2003p_2005/sankey_2003p_2005.html
            /transferencias/2003p_2007p/sankey_2003p_2007p.html
            /transferencias/2003p_2009/sankey_2003p_2009.html
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sitio/armar.py copiar _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
