# Publica los atlas en GitHub Pages: sitio/index.html, sus miniaturas y los HTML de catalogo.py (2-nov-2026).
name: Atlas en GitHub Pages
on:
  push:
    branches: [master]
    paths: ["mapas/**/*.html", "sitio/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            sitio
            mapas
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sitio/armar.py copiar _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
