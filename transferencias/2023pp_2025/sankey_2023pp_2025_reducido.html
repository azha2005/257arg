<text x="20" y="730" font-size="11.5" fill="#555">Matriz provincial, penalizada hacia la nacional: con pocas unidades se parece a ella. La auditoría por fila (* y †) es solo nacional.</text>
<text x="20" y="712" font-size="11.5" fill="#555">«No votó» y sus cintas están dibujados a escala 1:4 para ahorrar espacio; las cifras son las reales.</text>
