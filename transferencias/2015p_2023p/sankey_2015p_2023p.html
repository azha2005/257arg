<text x="20" y="766" font-size="11.5" fill="#555">Porcentajes sobre el padrón de 2023 de las unidades usadas. Método: mínimos cuadrados penalizados RxC (código de E. Calvo), una matriz por provincia.</text>
<text x="20" y="784" font-size="11.5" fill="#555">Fuente: DINE, escrutinio provisorio por mesa. Las celdas de categorías chicas (&lt;5 %) tienen márgenes de error grandes: ver intervalos.csv.</text>
<text x="20" y="748" font-size="11.5" fill="#555">* Fila no identificada: los datos no alcanzan para saber adónde fue; las dos variantes del modelo no coinciden (ver AUDITORIA.md).</text>
