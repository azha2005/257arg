<text x="20" y="784" font-size="11.5" fill="#555">Porcentajes sobre votos desglosados de 1989 de las unidades usadas. Método: mínimos cuadrados penalizados RxC (código de E. Calvo), una matriz por provincia.</text>
<text x="20" y="802" font-size="11.5" fill="#555">Fuente: Base departamental de E. Calvo; agrupaciones de los atlas locales. Las celdas de categorías chicas (&lt;5 %) tienen márgenes de error grandes: ver intervalos.csv.</text>
