<text x="20" y="784" font-size="11.5" fill="#555">Porcentajes sobre votos desglosados de 1987 de las unidades usadas. Método: mínimos cuadrados penalizados RxC (código de E. Calvo), una matriz por provincia.</text>
<text x="20" y="802" font-size="11.5" fill="#555">Fuente: Base departamental de E. Calvo; agrupaciones de los atlas locales. Las celdas de categorías chicas (&lt;5 %) tienen márgenes de error grandes: ver intervalos.csv.</text>
<text x="20" y="766" font-size="11.5" fill="#555">* Fila no identificada: los datos no alcanzan para saber adónde fue; las dos variantes del modelo no coinciden (ver AUDITORIA.md).</text>
<text x="20" y="748" font-size="11.5" fill="#555">Base del ajuste: 507 departamentos. Correspondencias y reservas: ver LEEME.md y correspondencias.csv.</text>
<text x="20" y="730" font-size="11.5" fill="#555">Cobertura: 96,4 % del voto desglosado de origen. Uniones completas; sin repartir votos.</text>
<text x="20" y="712" font-size="11.5" fill="#555">Sobre votos desglosados; sin abstención. Ver RESUMEN.md.</text>
